# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

exclude: |
  (?x)^(
    pixi\.lock|
    \.pixi/.*|
    assets/.*|
    WorldBuilders/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in sync with the ruff version pinned in CI and pixi.
    rev: v0.15.19
    hooks:
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
  - repo: local
    hooks:
      # .mdl files are plain text and git stores them directly, not in git lfs.
      # The hook reads the staged content (git grep --cached), not the file on disk:
      # after a merge of an older branch, the file on disk is correct but git can still store an lfs pointer.
      - id: no-lfs-pointer-mdl
        name: no git lfs pointer in .mdl files
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'if git grep --cached -l -E "^version https?://[^[:space:]]+$" -- "*.mdl"; then
          echo "git stores the files above as git lfs pointers. Fix: git add --renormalize . and commit."; exit 1; fi'
