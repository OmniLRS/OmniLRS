name: Base image version

# The CI base image (ci.docker/ci.Dockerfile) contains assets/, and the app image
# (artefacts.Dockerfile) ignores assets/. So a PR that changes assets/ must also
# build and push a new base image, and raise the FROM tag in artefacts.Dockerfile.
on:
  pull_request:
    paths:
      - assets/**
      - artefacts.Dockerfile
      - .github/workflows/base-image-version.yaml

permissions:
  contents: read

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2 # HEAD is the PR merge commit and HEAD^1 is the base branch

      - name: Check that the base image tag is higher when assets/ changes
        run: |
          if git diff --quiet HEAD^1 HEAD -- assets/; then
            echo "This PR does not change assets/."
            exit 0
          fi
          tag() { awk '/^FROM / && !done {n=split($2, a, ":"); print a[n]; done=1}'; }
          old=$(git show HEAD^1:artefacts.Dockerfile | tag)
          new=$(tag < artefacts.Dockerfile)
          echo "Base image tag: $old -> $new"
          if [ "$old" = "$new" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error file=artefacts.Dockerfile::This PR changes assets/, so it needs a new base image. Build and push the base image with a higher tag (see ci.docker/README.md), then put that tag in the FROM line of artefacts.Dockerfile."
            exit 1
          fi
