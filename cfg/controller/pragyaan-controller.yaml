# @package environment
# do not remove the above comment, it injects the below configs into environment configs

robots_settings:
  robot_controller: "pragyaan-controller"
  yamcs_tmtc: # these settings are relevant if Yamcs mode
    mdb:
      - "cfg/mdb/pragyaan/rover.xml"
      - "cfg/mdb/pragyaan/lander.xml"
      - "cfg/mdb/pragyaan/admin.xml"
    intervals:
      robot_stats: 1
      neutron_count: 2
      camera_streaming: 1
    camera_compression:
      bitrate: 150_000 # Target bits/s with Video Buffering Verifier (VBV) constraints
      crf:      # Set 0-51 for quality-based mode; higher means lower quality, bitrate is ignored
      keyframe_interval: 10 # Keyframe interval in number of frames
      max_payload_size: 1200 # Maximum payload size in bytes
      loss_probability: 0.01 # between 0.0 and 1.0; Per-network-packet drop probability (not commandable)
      seed:      # Seed for reproducible packet loss (not commandable)
      bandwidth_window_seconds: 10.0 # Rolling bitrate measurement window in seconds
    lander_camera:
      prim_path: "/StaticAssets/lander/Lander/Cam_Right/Lander_Camera"
      resolution: [1440, 1080]
    images:
      no_data_image_path: "${oc.env:OMNILRS_ROOT,.}/assets/images/no_data_grafana.png"
      buckets:
        - name: images_lander
          path: /Lander/camera/images_oncommand
        - name: images_monitoring
          path: /Admin/camera/images_monitoring
        - name: images_depth_cam_depth
          path: /Rover/camera/images_depth_cam_depth
        - name: images_oncommand_cam_depth
          path: /Rover/camera/images_oncommand_cam_depth
        - name: images_streaming_cam_depth
          path: /Rover/camera/images_streaming_cam_depth
        - name: images_depth_NavCam_left
          path: /Rover/camera/images_depth_NavCam_left
        - name: images_oncommand_NavCam_left
          path: /Rover/camera/images_oncommand_NavCam_left
        - name: images_streaming_NavCam_left
          path: /Rover/camera/images_streaming_NavCam_left
        - name: images_depth_NavCam_right
          path: /Rover/camera/images_depth_NavCam_right
        - name: images_oncommand_NavCam_right
          path: /Rover/camera/images_oncommand_NavCam_right
        - name: images_streaming_NavCam_right
          path: /Rover/camera/images_streaming_NavCam_right
    payload:
      apxs:
        resolution: [1440, 1080]
        samples_dir: "${oc.env:OMNILRS_ROOT,.}/assets/images/"
        no_data: "APXS_nodata.png"
        measurement: "APXS_measurement.png"
        bucket:
          name: "images_apxs"
          path: "/Rover/payload/images_apxs"
    parameters:
      pose_of_base_link: "/Rover/pose_ground_truth"
      go_nogo: "/Rover/go_nogo"
      imu_accelerometer: "/Rover/imu_accelerometer"
      imu_gyroscope: "/Rover/imu_gyroscope"
      imu_orientation: "/Rover/imu_orientation"
      obc_state: "/Rover/obc_state"
      obc_cpu_usage: "/Rover/obc_cpu_usage"
      obc_ram_usage: "/Rover/obc_ram_usage"
      obc_disk_usage: "/Rover/obc_disk_usage"
      obc_uptime: "/Rover/obc_uptime"
      rssi: "/Rover/radio_rssi"
      temperature_front: "/Rover/temperature_front"
      temperature_back: "/Rover/temperature_back"
      temperature_left: "/Rover/temperature_left"
      temperature_right: "/Rover/temperature_right"
      temperature_top: "/Rover/temperature_top"
      temperature_bottom: "/Rover/temperature_bottom"
      temperature_elec_box: "/Rover/temperature_elec_box"
      battery_charge: "/Rover/battery_charge"
      battery_voltage: "/Rover/battery_voltage"
      total_current_in: "/Rover/total_current_in"
      total_current_out: "/Rover/total_current_out"
      motor_current: "/Rover/motor_current"
      current_draw_obc: "/Rover/current_draw_obc"
      current_draw_motor_controller: "/Rover/current_draw_motor_controller"
      current_draw_neutron_spectrometer: "/Rover/current_draw_neutron_spectrometer"
      current_draw_apxs: "/Rover/current_draw_apxs"
      current_draw_camera: "/Rover/current_draw_camera"
      current_draw_radio: "/Rover/current_draw_radio"
      current_draw_eps: "/Rover/current_draw_eps"
      neutron_counts: "/Rover/neutron_counts"
      solar_panel_state: "/Rover/solar_panel_state"
      motor_encoder: "/Rover/motor_encoder"
      camera_streaming_state_cam_depth: 
        /Rover/camera/images_streaming_cam_depth/state
      camera_streaming_state_NavCam_left: 
        /Rover/camera/images_streaming_NavCam_left/state
      camera_streaming_state_NavCam_right: 
        /Rover/camera/images_streaming_NavCam_right/state
      camera_bandwidth_cam_depth: 
        /Rover/camera/images_streaming_cam_depth/bandwidth
      camera_bandwidth_NavCam_left: 
        /Rover/camera/images_streaming_NavCam_left/bandwidth
      camera_bandwidth_NavCam_right: 
        /Rover/camera/images_streaming_NavCam_right/bandwidth
      camera_packets_sent_cam_depth: 
        /Rover/camera/images_streaming_cam_depth/packets_sent
      camera_packets_sent_NavCam_left: 
        /Rover/camera/images_streaming_NavCam_left/packets_sent
      camera_packets_sent_NavCam_right: 
        /Rover/camera/images_streaming_NavCam_right/packets_sent
      camera_packets_lost_cam_depth: 
        /Rover/camera/images_streaming_cam_depth/packets_lost
      camera_packets_lost_NavCam_left: 
        /Rover/camera/images_streaming_NavCam_left/packets_lost
      camera_packets_lost_NavCam_right: 
        /Rover/camera/images_streaming_NavCam_right/packets_lost
      camera_decode_errors_cam_depth: 
        /Rover/camera/images_streaming_cam_depth/decode_errors
      camera_decode_errors_NavCam_left: 
        /Rover/camera/images_streaming_NavCam_left/decode_errors
      camera_decode_errors_NavCam_right: 
        /Rover/camera/images_streaming_NavCam_right/decode_errors
    commands:
      drive_straight: "/Rover/motor/drive_straight"
      drive_turn: "/Rover/motor/drive_turn"
      camera_capture_high: "/Rover/camera/camera_capture_high"
      camera_streaming_on_off: "/Rover/camera/camera_streaming"
      camera_capture_depth: "/Rover/camera/camera_capture_depth"
      set_camera_streaming_params: "/Rover/camera/set_camera_streaming_params"
      solar_panel: "/Rover/system/deploy_solar_panel"
      power_electronics: "/Rover/power/power_electronics"
      go_nogo: "/Rover/system/go_nogo_command"
      capture_apxs: "/Rover/payload/payload_capture_apxs"
      admin_battery_percentage: "/Admin/admin_set_battery_percentage"
      admin_water_detection: "/Admin/admin_water_detection"
      admin_inject_fault: "/Admin/admin_inject_fault"
      lander_camera_capture_high: "/Lander/camera/lander_camera_capture"
