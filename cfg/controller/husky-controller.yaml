# @package environment
# do not remove the above comment, it injects the below configs into environment configs

robots_settings:
  robot_controller: "husky-controller"
  yamcs_tmtc:
    mdb:
      - "cfg/mdb/husky/rover.xml"
    intervals:
      robot_stats: 1
      camera_streaming: 2
    images:
      no_data_image_path: "${oc.env:OMNILRS_ROOT,.}/assets/images/no_data_grafana.png"
      buckets:
        - name: images_depth_cam_color
          path: /Rover/camera/images_depth_cam_color
        - name: images_oncommand_cam_color
          path: /Rover/camera/images_oncommand_cam_color
        - name: images_streaming_cam_color
          path: /Rover/camera/images_streaming_cam_color
        - name: images_depth_cam_left
          path: /Rover/camera/images_depth_cam_left
        - name: images_oncommand_cam_left
          path: /Rover/camera/images_oncommand_cam_left
        - name: images_streaming_cam_left
          path: /Rover/camera/images_streaming_cam_left
        - name: images_depth_cam_right
          path: /Rover/camera/images_depth_cam_right
        - name: images_oncommand_cam_right
          path: /Rover/camera/images_oncommand_cam_right
        - name: images_streaming_cam_right
          path: /Rover/camera/images_streaming_cam_right
    parameters:
      pose_of_base_link: "/Rover/pose_ground_truth"
      go_nogo: "/Rover/go_nogo"
      imu_accelerometer: "/Rover/imu_accelerometer"
      imu_gyroscope: "/Rover/imu_gyroscope"
      imu_orientation: "/Rover/imu_orientation"
      obc_state: "/Rover/obc_state"
      obc_cpu_usage: "/Rover/obc_cpu_usage"
      obc_ram_usage: "/Rover/obc_ram_usage"
      obc_disk_usage: "/Rover/obc_disk_usage"
      obc_uptime: "/Rover/obc_uptime"
      rssi: "/Rover/radio_rssi"
      temperature_front: "/Rover/temperature_front"
      temperature_back: "/Rover/temperature_back"
      temperature_left: "/Rover/temperature_left"
      temperature_right: "/Rover/temperature_right"
      temperature_top: "/Rover/temperature_top"
      temperature_bottom: "/Rover/temperature_bottom"
      battery_charge: "/Rover/battery_charge"
      battery_voltage: "/Rover/battery_voltage"
      total_current_out: "/Rover/total_current_out"
      motor_current: "/Rover/motor_current"
      current_draw_obc: "/Rover/current_draw_obc"
      current_draw_motor_controller: "/Rover/current_draw_motor_controller"
      current_draw_camera: "/Rover/current_draw_camera"
      current_draw_radio: "/Rover/current_draw_radio"
      current_draw_eps: "/Rover/current_draw_eps"
      motor_encoder: "/Rover/motor_encoder"
      camera_streaming_state_cam_color: 
        /Rover/camera/images_streaming_cam_color/state
      camera_streaming_state_cam_left: 
        /Rover/camera/images_streaming_cam_left/state
      camera_streaming_state_cam_right: 
        /Rover/camera/images_streaming_cam_right/state
    commands:
      drive_straight: "/Rover/motor/drive_straight"
      drive_turn: "/Rover/motor/drive_turn"
      camera_capture_high: "/Rover/camera/camera_capture_high"
      camera_streaming_on_off: "/Rover/camera/camera_streaming"
      camera_capture_depth: "/Rover/camera/camera_capture_depth"
