# @package environment
# do not remove the above comment, it injects the below configs into environment configs

robots_settings:
  robot_controller: "husky-controller"
  yamcs_tmtc: # These settings are relevant if mode=Yamcs
    # The Yamcs server MDB is the single source of truth for TM/TC. At startup OmniLRS fetches the space systems
    # listed in mdb_space_systems from the server and checks every path and image bucket below against it
    # (missing -> abort, extra -> warn).
    # Camera buckets and camera telemetry are not listed here: they are computed from the robot yaml cameras
    # (name + type) by src/tmtc/yamcs_naming.py, the same module the Yamcs server MDB and bucket generator uses.
    mdb_space_systems: ["/Rover"] # fetched from the Yamcs server at startup
    intervals:
      robot_stats: 1
      camera_streaming: 2
    images:
      no_data_image_path: "${oc.env:OMNILRS_ROOT,.}/assets/images/no_data_grafana.png"
      clear_buckets_on_startup: true # (default true) delete the previous images in every bucket OmniLRS uses;
      # false keeps them and continues each bucket's numbering after its last image
      # Buckets (Yamcs storage buckets OmniLRS uploads images to):
      # The buckets of the rover's cameras (which are defined in cfg/robot yaml) are computed, not listed here.
      # For additional buckets, define them below by role.
      # OmniLRS does not create buckets: generate_mdb_rover.py (yamcs-mission-control repository) declares all of them
      # in the Yamcs yamcs.yaml, and the startup check aborts if one is missing.
      #   name: Yamcs storage bucket
      #   path: MDB space system receiving number/name/url_* metadata
      buckets: {}
    parameters:
      # Note: the per-camera telemetry (streaming state) is computed from the robot cameras and
      # STREAMING_FIELDS in src/mission_specific/husky/tmtc/enums.py, not listed here.
      # List other non-camera telemetry here:
      pose_of_base_link: "/Rover/pose_ground_truth"
      go_nogo: "/Rover/go_nogo"
      imu_accelerometer: "/Rover/imu_accelerometer"
      imu_gyroscope: "/Rover/imu_gyroscope"
      imu_orientation: "/Rover/imu_orientation"
      obc_state: "/Rover/obc_state"
      obc_cpu_usage: "/Rover/obc_cpu_usage"
      obc_ram_usage: "/Rover/obc_ram_usage"
      obc_disk_usage: "/Rover/obc_disk_usage"
      obc_uptime: "/Rover/obc_uptime"
      rssi: "/Rover/radio_rssi"
      temperature_front: "/Rover/temperature_front"
      temperature_back: "/Rover/temperature_back"
      temperature_left: "/Rover/temperature_left"
      temperature_right: "/Rover/temperature_right"
      temperature_top: "/Rover/temperature_top"
      temperature_bottom: "/Rover/temperature_bottom"
      battery_charge: "/Rover/battery_charge"
      battery_voltage: "/Rover/battery_voltage"
      total_current_out: "/Rover/total_current_out"
      motor_current: "/Rover/motor_current"
      current_draw_obc: "/Rover/current_draw_obc"
      current_draw_motor_controller: "/Rover/current_draw_motor_controller"
      current_draw_camera: "/Rover/current_draw_camera"
      current_draw_radio: "/Rover/current_draw_radio"
      current_draw_eps: "/Rover/current_draw_eps"
      motor_encoder: "/Rover/motor_encoder"
    commands:
      # Note: Camera commands take a camera_name argument; its allowed values are checked against the robot cameras' types
      # e.g. (capture_depth -> depth cameras, the other camera commands -> rgba cameras).
      # List all commands here:
      go_nogo: "/Rover/system/go_nogo_command" # the Husky starts in GO; NOGO stops it and blocks the drive commands
      drive_straight: "/Rover/motor/drive_straight"
      drive_turn: "/Rover/motor/drive_turn"
      camera_capture_high: "/Rover/camera/camera_capture_high"
      camera_streaming_on_off: "/Rover/camera/camera_streaming"
      camera_capture_depth: "/Rover/camera/camera_capture_depth"
