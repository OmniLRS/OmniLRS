# @package environment
# do not remove the above comment, it injects the settings below into the environment config

robots_settings:
  parameters:
    robot_name: husky
    # usd_path: assets/USD_Assets/robots/ros2_husky_PhysX_vlp16.usd
    # usd_path: assets/USD_Assets/robots/ros2_husky_PhysX_vlp16_mono_depth_imu.usd
    usd_path: assets/USD_Assets/robots/nograph_husky.usd
    pose:
        # position: [26., 16.6, 0.8] # Lunaryard, LargeScale
        position: [5.0, 5.0, 0.1] # Lunalab
        orientation: [0.70711, 0., 0., 0.70711]
    base_link: "base_link" # core link used to determine the position of the robot
    domain_id: 0
    target_links: ["front_left_wheel_link", "front_right_wheel_link", "rear_left_wheel_link", "rear_right_wheel_link"]

    drive: # wheel kinematics of the Yamcs drive commands (src/tmtc/drive_handler.py, DriveConf)
      wheel_radius: 0.1778 # m
      track_width: 0.571 # m, between the left and right wheel centers
      skid_steer_factor: 3.24 # effective track / track_width; keeps the turn rate of turn_speed_coef 6.5 (not measured)
    pos_relative_to_prim: ""
    wheel_joints:
      left: ["front_left_wheel", "rear_left_wheel"]
      right: ["front_right_wheel", "rear_right_wheel"]
    imu_sensor_path: "/Robots/husky/d455/RSD455/Imu_Sensor"
    # Define camera names and types here:
    #   type: render products created per resolution. rgba -> streaming + oncommand commands, depth -> capture depth commands
    #   Parsed and validated with the robot config in every mode (src/configurations/robot_camera_confs.py)
    #   In Zenoh mode, every rgba camera is published per resolution: OmniLRS/husky/camera/<camera>/<resolution>
    # Camera bucket and telemetry names are then automatically derived from this list:
    #   - OmniLRS computes the names at startup with the src/tmtc/yamcs_naming.py module and checks them against the Yamcs server MDB and buckets
    #   - in the yamcs-mission-control repository, generate_mdb_rover.py also reads this file and uses that module to build the Yamcs MDB
    #     and the image buckets (yamcs.yaml)
    camera:
      - name: "cam_color"
        prim_path: "/Robots/husky/d455/RSD455/Camera_OmniVision_OV9782_Color"
        type: [rgba]
        resolutions:
          low: [320, 240]
          high: [1280, 720]
      - name: "cam_left" # the D455 depth is aligned to its left imager
        prim_path: "/Robots/husky/d455/RSD455/Camera_OmniVision_OV9782_Left"
        type: [rgba, depth]
        resolutions:
          low: [320, 240]
          high: [1280, 720]
      - name: "cam_right"
        prim_path: "/Robots/husky/d455/RSD455/Camera_OmniVision_OV9782_Right"
        type: [rgba]
        resolutions:
          low: [320, 240]
          high: [1280, 720]
    zenoh:
      camera:
        publish_period_s: 0.2 # 5 hz
        wire_format: "msgspec" # specify custom wire_format, not using default_wire_format in Zenoh.yaml
        is_logging: False
      imu:
        publish_period_s: 0.02
        is_logging: False
      joint_telemetry:
        publish_period_s: 0.1
        init_retry_s: 0.5
        not_ready_log_period_s: 1.0
        keep_history: False
        history_len: 200
        is_logging: False
      joint_commands:
        is_logging: False
      ground_truth_pose:
        is_logging: False
