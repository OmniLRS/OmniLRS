# @package environment
# do not remove the above comment, it injects the settings below into the environment config

robots_settings:
  parameters:
    robot_name: pragyaan
    usd_path: assets/USD_Assets/robots/pragyaan/nograph_pragyaan.usd
    pose:
      position: [26., 16.6, 0.42] # Lunaryard, LargeScale
      # position: [5.0, 5.0, 0.1] # Lunalab
      orientation: [0.70711, 0., 0., 0.70711] # w, x, y, z. The asset is REP-103 (x forward, z up): yaw 90 deg, facing +y
      height_above_terrain_override: 0.42 # optional, replaces position z with terrain height at (x, y) + this value. base_link is 0.25 m above the ground at rest
    base_link: "base_link" # core link used to determine the position of the robot
    pos_relative_to_prim: "/StaticAssets/lander"  # if no lander in environment, rover position will be reported in world frame and a warning will be printed at initialization
    target_links: [
      "Mobility/Wheel_front_left",
      "Mobility/Wheel_front_right",
      "Mobility/Wheel_middle_left",
      "Mobility/Wheel_middle_right",
      "Mobility/Wheel_back_left",
      "Mobility/Wheel_back_right"
    ]
    wheel_joints:
      left: ["wheel_fl", "wheel_ml", "wheel_bl"]
      right: ["wheel_fr", "wheel_mr", "wheel_br"]
    dimensions:
      width: 1.6 # m
      length: 1.5
    turn_speed_coef: 19
    imu_sensor_path: "/Robots/pragyaan/base_link/Imu_Sensor"
    solar_panel_joint: "solarJoint"  # finds it within the main robot articulation
    # Define camera names and types here:
    #   type: render products created per resolution. rgba -> streaming + oncommand commands, depth -> capture depth commands
    #   Parsed and validated with the robot config in every mode (src/configurations/robot_camera_confs.py)
    # Camera bucket and telemetry names are then automatically derived from this list:
    #   - OmniLRS computes the names at startup with the src/tmtc/yamcs_naming.py module and checks them against the Yamcs server MDB and buckets
    #   - in the yamcs-mission-control repository, generate_mdb_rover.py also reads this file and uses that module to build the Yamcs MDB
    #     and the image buckets (yamcs.yaml)
    camera:
      - name: "cam_depth"
        prim_path: "/Robots/pragyaan/Body/body_main/depth_cam"
        type: [depth]
        resolutions:
          low: [320, 240]
          high: [1440, 1080]
      - name: "NavCam_left"
        prim_path: "/Robots/pragyaan/Body/NavCam_left/NavCam_left"
        type: [rgba]
        resolutions:
          low: [320, 240]
          high: [1440, 1080]
      - name: "NavCam_right"
        prim_path: "/Robots/pragyaan/Body/NavCam_right/NavCam_right"
        type: [rgba]
        resolutions:
          low: [320, 240]
          high: [1440, 1080]
