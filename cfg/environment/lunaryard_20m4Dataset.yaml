# Lunaryard environment for mode=SDG_Dataset (20 m procedural yard: craters, rocks, LunarRegolith8k texture).
# Differences from lunaryard_20m4SDG.yaml: texture_path -> LunarRegolith8k (the hi-res regolith); every rock group uses
# the CustomInstancer (use_point_instancer: False) so each rock is a prim with a semantic class and an instance id
# (PointInstancer rocks are invisible to the instance annotator, which would drop the small-rock class); rock densities
# ~4x lower to keep ~1-2k rock prims per terrain; seed is overridden per shard from the command line and the
# per-terrain reseed happens in code.
name: Lunaryard
seed: 42
lunaryard_settings:
  lab_length: 20.0
  lab_width: 20.0
  resolution: 0.025
  coordinates:
    latitude: -89.5
    longitude: 0.0

sun_settings:
  intensity: 1750.0
  angle: 0.53
  diffuse_multiplier: 1.0
  specular_multiplier: 1.0
  color: [1.0, 1.0, 1.0]
  temperature: 6000.0
  azimuth: 180.0
  elevation: 8.0

rocks_settings:
  instancers_path: /Lunaryard/Rocks
  rocks_settings:
    medium_rocks:
      seed: ${....seed}
      collections: ["apollo_rocks"]
      use_point_instancer: False
      class: rock
      requests:
        req_pos_xy:
          attribute: Position
          axes: ["x", "y"]
          layer: {name: Image, mpp_resolution: "${.......lunaryard_settings.resolution}", output_space: 2}
          sampler: {name: ThomasCluster, randomization_space: 2, lambda_parent: 0.05, lambda_daughter: 40, sigma: 0.25, seed: "${.......seed}"}
        req_pos_z:
          attribute: Position
          axes: ["z"]
          layer: {name: Image, output_space: 1}
          sampler: {name: Image, randomization_space: 1, mpp_resolution: "${.......lunaryard_settings.resolution}"}
        req_random_z_rot:
          attribute: Orientation
          axes: ["x", "y", "z", "w"]
          layer: {name: RollPitchYaw, rmax: 0, rmin: 0, pmax: 0, pmin: 0, ymax: 6.28318530718, ymin: 0}
          sampler: {name: Uniform, randomization_space: 3, seed: "${.......seed}"}
        req_scale:
          attribute: Scale
          axes: ["xyz"]
          layer: {name: Line, xmin: 0.6, xmax: 1.4}
          sampler: {name: Uniform, randomization_space: 1, seed: "${.......seed}"}

    large_rocks:
      seed: ${....seed}
      collections: ["apollo_rocks"]
      use_point_instancer: False
      parent: medium_rocks
      class: rock
      requests:
        req_pos_xy:
          attribute: Position
          axes: ["x", "y"]
          layer: {name: Image, mpp_resolution: "${.......lunaryard_settings.resolution}", output_space: 2}
          sampler: {name: ThomasCluster, randomization_space: 2, lambda_parent: 0.25, lambda_daughter: 3, sigma: 0.05, inherit_parents: True, seed: "${.......seed}"}
        req_pos_z:
          attribute: Position
          axes: ["z"]
          layer: {name: Image, output_space: 1}
          sampler: {name: Image, randomization_space: 1, mpp_resolution: "${.......lunaryard_settings.resolution}"}
        req_random_z_rot:
          attribute: Orientation
          axes: ["x", "y", "z", "w"]
          layer: {name: RollPitchYaw, rmax: 0, rmin: 0, pmax: 0, pmin: 0, ymax: 6.28318530718, ymin: 0}
          sampler: {name: Uniform, randomization_space: 3, seed: "${.......seed}"}
        req_scale:
          attribute: Scale
          axes: ["xyz"]
          layer: {name: Line, xmin: 2.0, xmax: 5.0}
          sampler: {name: Uniform, randomization_space: 1, seed: "${.......seed}"}

    small_rocks:
      seed: ${....seed}
      collections: ["apollo_rocks"]
      use_point_instancer: False
      parent: medium_rocks
      class: rock
      requests:
        req_pos_xy:
          attribute: Position
          axes: ["x", "y"]
          layer: {name: Image, mpp_resolution: "${.......lunaryard_settings.resolution}", output_space: 2}
          sampler: {name: ThomasCluster, randomization_space: 2, lambda_parent: 0.25, lambda_daughter: 120, sigma: 0.3, inherit_parents: True, seed: "${.......seed}"}
        req_pos_z:
          attribute: Position
          axes: ["z"]
          layer: {name: Image, output_space: 1}
          sampler: {name: Image, randomization_space: 1, mpp_resolution: "${.......lunaryard_settings.resolution}"}
        req_random_z_rot:
          attribute: Orientation
          axes: ["x", "y", "z", "w"]
          layer: {name: RollPitchYaw, rmax: 0, rmin: 0, pmax: 0, pmin: 0, ymax: 6.28318530718, ymin: 0}
          sampler: {name: Uniform, randomization_space: 3, seed: "${.......seed}"}
        req_scale:
          attribute: Scale
          axes: ["xyz"]
          layer: {name: Line, xmin: 0.05, xmax: 0.30}
          sampler: {name: Uniform, randomization_space: 1, seed: "${.......seed}"}

terrain_manager:
  moon_yard:
    crater_generator:
      profiles_path: assets/Terrains/crater_spline_profiles.pkl
      min_xy_ratio: 0.85
      max_xy_ratio: 1.0
      resolution: ${....lunaryard_settings.resolution}
      pad_size: 500
      random_rotation: True
      z_scale: 1.0
      seed: ${....seed}
    crater_distribution:
      x_size: ${....lunaryard_settings.lab_length}
      y_size: ${....lunaryard_settings.lab_width}
      densities: [0.03, 0.08, 0.6]
      radius: [[1.5, 3.0], [0.75, 1.5], [0.2, 0.5]]
      num_repeat: 0
      seed: ${....seed}
    base_terrain_generator:
      x_size: ${....lunaryard_settings.lab_length}
      y_size: ${....lunaryard_settings.lab_width}
      resolution: ${....lunaryard_settings.resolution}
      max_elevation: 0.8
      min_elevation: -0.8
      z_scale: 1.0
      seed: ${....seed}
    deformation_engine:   # disabled; block mirrors cfg/environment/lunaryard_20m.yaml
      enable: False
      delay: 2.0
      terrain_width: ${....lunaryard_settings.lab_width}
      terrain_height: ${....lunaryard_settings.lab_length}
      terrain_resolution: ${....lunaryard_settings.resolution}
      footprint: {width: 0.25, height: 0.1}
      deform_constrain: {x_deform_offset: 0.0, y_deform_offset: 0.0, deform_decay_ratio: 0.01}
      boundary_distribution: {distribution: trapezoidal, angle_of_repose: 1.047}
      depth_distribution: {distribution: sinusoidal, wave_frequency: 4.14}
      force_depth_regression: {amplitude_slope: 0.00006, amplitude_intercept: 0.008, mean_slope: -0.00046, mean_intercept: -0.0013}
      num_links: 4
    is_yard: False
    is_lab: True
  root_path: /Lunaryard
  texture_path: /Lunaryard/Looks/LunarRegolith8k
  dems_path: Terrains/Lunaryard
  mesh_position: [0, 0, 0]
  mesh_orientation: [0, 0, 0, 1]
  mesh_scale: [1, 1, 1]
  sim_length: ${..lunaryard_settings.lab_length}
  sim_width: ${..lunaryard_settings.lab_width}
  resolution: ${..lunaryard_settings.resolution}
